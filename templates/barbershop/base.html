{% load static %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Tio Bigode{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'barbershop/styles.css' %}">
    <script defer src="{% static 'barbershop/app.js' %}"></script>
  </head>
  <body>
    {% if messages %}
      <div class="toast-stack" aria-live="polite">
        {% for message in messages %}
          <div class="toast {{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block body %}{% endblock %}
  </body>
</html>
